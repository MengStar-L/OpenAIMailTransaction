name: Verify published Linux systemd update

on:
  workflow_dispatch:
    inputs:
      release:
        description: Published latest stable release to verify
        required: true
        default: v1.0.1
        type: string

permissions:
  contents: read

concurrency:
  group: verify-published-systemd-update
  cancel-in-progress: false

jobs:
  systemd-self-update:
    if: github.repository == 'MengStar-L/OpenAIMailTransaction'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - name: Build the isolated older test version
        env:
          CGO_ENABLED: '0'
          UPDATE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=0.9.0 -X main.repository=$UPDATE_REPOSITORY" -o "$RUNNER_TEMP/shiguang-update-old" .
          "$RUNNER_TEMP/shiguang-update-old" --version
      - name: Verify actual release download and systemd self-update
        env:
          UPDATE_TARGET: ${{ inputs.release }}
        shell: bash
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 scripts/test-systemd-update.py \
            --release "$UPDATE_TARGET" \
            --old-binary "$RUNNER_TEMP/shiguang-update-old" \
            --report "$RUNNER_TEMP/shiguang-systemd-update-result.json"
      - name: Upload acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-systemd-update-acceptance
          path: ${{ runner.temp }}/shiguang-systemd-update-result.json
          if-no-files-found: ignore
          retention-days: 7
