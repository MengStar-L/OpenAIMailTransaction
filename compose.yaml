services:
  atelier:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      LISTEN_ADDR: :8080
      DATA_DIR: /data
    volumes:
      - atelier-data:/data
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
volumes:
  atelier-data:
